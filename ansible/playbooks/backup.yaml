
---
- name: Backup k3s datastore
  hosts: controllers
  become: true
  roles:
    - role: backup
      tasks_from: k3s

- name: Backup local-path storage
  hosts: workers
  become: true
  serial: 1
  roles:
    - role: backup
      tasks_from: pvc

- name: Backup Vault
  hosts: vault
  become: true
  roles:
    - role: backup
      tasks_from: vault
