---
- name: Require explicit restore confirmation
  ansible.builtin.assert:
    that:
      - confirm_restore | default(false) | bool
    fail_msg: "Restore blocked. Explicit confirmation is required."

- name: Verify k3s backup
  delegate_to: localhost
  become: false
  block:
    - name: Check backup archive
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/k3s-backups/k3s-backup.tar.gz"
      register: k3s_backup

    - name: Require backup archive
      ansible.builtin.assert:
        that:
          - k3s_backup.stat.isreg | default(false)

    - name: Verify archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - -tzf
          - "{{ lookup('env', 'HOME') }}/k3s-backups/k3s-backup.tar.gz"
      changed_when: false

- name: Check existing restore state
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db.pre-restore
  register: previous_db

- name: Require clean restore state
  ansible.builtin.assert:
    that:
      - not previous_db.stat.exists
    fail_msg: "Previous restore database exists. Restore blocked."

- name: Check previous token backup
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/token.pre-restore
  register: previous_token

- name: Require clean token state
  ansible.builtin.assert:
    that:
      - not previous_token.stat.exists
    fail_msg: "Previous restore token exists. Restore blocked."

- name: Upload k3s backup
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/k3s-backups/k3s-backup.tar.gz"
    dest: /root/k3s-restore.tar.gz
    owner: root
    group: root
    mode: "0600"

- name: Restore k3s datastore
  block:
    - name: Stop k3s worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: stopped
      delegate_to: "{{ groups['workers'][0] }}"

    - name: Stop k3s controller
      ansible.builtin.systemd_service:
        name: k3s
        state: stopped

    - name: Preserve existing token
      ansible.builtin.copy:
        src: /var/lib/rancher/k3s/server/token
        dest: /var/lib/rancher/k3s/server/token.pre-restore
        remote_src: true
        mode: "0600"

    - name: Preserve existing database
      ansible.builtin.command:
        argv:
          - mv
          - /var/lib/rancher/k3s/server/db
          - /var/lib/rancher/k3s/server/db.pre-restore

    - name: Restore database and token
      ansible.builtin.unarchive:
        src: /root/k3s-restore.tar.gz
        dest: /var/lib/rancher/k3s/server/
        remote_src: true

    - name: Start k3s controller
      ansible.builtin.systemd_service:
        name: k3s
        state: started

    - name: Start k3s worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started
      delegate_to: "{{ groups['workers'][0] }}"

  rescue:
    - name: Stop controller for rollback
      ansible.builtin.systemd_service:
        name: k3s
        state: stopped
      ignore_errors: true

    - name: Check original database
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db.pre-restore
      register: rollback_db

    - name: Remove failed database
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/db
        state: absent
      when: rollback_db.stat.exists

    - name: Restore original database
      ansible.builtin.command:
        argv:
          - mv
          - /var/lib/rancher/k3s/server/db.pre-restore
          - /var/lib/rancher/k3s/server/db
      when: rollback_db.stat.exists

    - name: Check original token
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/token.pre-restore
      register: rollback_token

    - name: Restore original token
      ansible.builtin.copy:
        src: /var/lib/rancher/k3s/server/token.pre-restore
        dest: /var/lib/rancher/k3s/server/token
        remote_src: true
        mode: "0600"
      when: rollback_token.stat.exists

    - name: Start original controller
      ansible.builtin.systemd_service:
        name: k3s
        state: started

    - name: Start original worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started
      delegate_to: "{{ groups['workers'][0] }}"

    - name: Report failed restore
      ansible.builtin.fail:
        msg: "k3s restore failed. Rollback attempted."

  always:
    - name: Remove temporary k3s archive
      ansible.builtin.file:
        path: /root/k3s-restore.tar.gz
        state: absent