---
- name: Require restore confirmation
  ansible.builtin.assert:
    that:
      - confirm_restore | default(false) | bool
    fail_msg: "Restore blocked. Confirmation required."

- name: Verify k3s backup
  delegate_to: localhost
  become: false
  block:
    - name: Check backup archive
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/k3s-backups/k3s-backup.tar.gz"
      register: k3s_backup

    - name: Require backup archive
      ansible.builtin.assert:
        that:
          - k3s_backup.stat.isreg | default(false)

    - name: Verify archive integrity
      ansible.builtin.command:
        argv:
          - tar
          - -tzf
          - "{{ lookup('env', 'HOME') }}/k3s-backups/k3s-backup.tar.gz"
      changed_when: false

- name: Check previous restore files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/lib/rancher/k3s/server/db.pre-restore
    - /var/lib/rancher/k3s/server/token.pre-restore
  register: previous_restore

- name: Require clean restore state
  ansible.builtin.assert:
    that:
      - previous_restore.results | selectattr('stat.exists') | list | length == 0
    fail_msg: "Previous restore files exist. Restore blocked."

- name: Upload k3s backup
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/k3s-backups/k3s-backup.tar.gz"
    dest: /root/k3s-restore.tar.gz
    owner: root
    group: root
    mode: "0600"

- name: Restore k3s
  block:
    - name: Stop worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: stopped
      delegate_to: "{{ groups['workers'][0] }}"

    - name: Stop controller
      ansible.builtin.systemd_service:
        name: k3s
        state: stopped

    - name: Preserve existing token
      ansible.builtin.copy:
        src: /var/lib/rancher/k3s/server/token
        dest: /var/lib/rancher/k3s/server/token.pre-restore
        remote_src: true
        mode: "0600"

    - name: Preserve existing database
      ansible.builtin.command:
        argv:
          - mv
          - /var/lib/rancher/k3s/server/db
          - /var/lib/rancher/k3s/server/db.pre-restore

    - name: Extract backup
      ansible.builtin.unarchive:
        src: /root/k3s-restore.tar.gz
        dest: /var/lib/rancher/k3s/server/
        remote_src: true

    - name: Start controller
      ansible.builtin.systemd_service:
        name: k3s
        state: started

    - name: Start worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started
      delegate_to: "{{ groups['workers'][0] }}"

    - name: Verify Kubernetes nodes
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=180s
      changed_when: false

  rescue:
    - name: Check preserved database
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db.pre-restore
      register: original_db

    - name: Rollback database
      when: original_db.stat.exists
      block:
        - name: Stop controller for rollback
          ansible.builtin.systemd_service:
            name: k3s
            state: stopped

        - name: Remove failed database
          ansible.builtin.file:
            path: /var/lib/rancher/k3s/server/db
            state: absent

        - name: Restore original database
          ansible.builtin.command:
            argv:
              - mv
              - /var/lib/rancher/k3s/server/db.pre-restore
              - /var/lib/rancher/k3s/server/db

        - name: Check original token
          ansible.builtin.stat:
            path: /var/lib/rancher/k3s/server/token.pre-restore
          register: original_token

        - name: Restore original token
          ansible.builtin.copy:
            src: /var/lib/rancher/k3s/server/token.pre-restore
            dest: /var/lib/rancher/k3s/server/token
            remote_src: true
            mode: "0600"
          when: original_token.stat.exists

    - name: Report restore failure
      ansible.builtin.fail:
        msg: "k3s restore failed. Rollback attempted if database was preserved."

  always:
    - name: Start controller
      ansible.builtin.systemd_service:
        name: k3s
        state: started

    - name: Start worker
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started
      delegate_to: "{{ groups['workers'][0] }}"

    - name: Remove temporary archive
      ansible.builtin.file:
        path: /root/k3s-restore.tar.gz
        state: absent