---
- name: Require restore confirmation
  ansible.builtin.assert:
    that:
      - confirm_restore | default(false) | bool
    fail_msg: "Restore blocked. Confirmation required."

- name: Validate GCS backup path
  ansible.builtin.assert:
    that:
      - gcp_backup_object is defined
      - gcp_backup_object is match('^gs://proxmox-iac-lab-backups/vault/vault-backup-[0-9]{8}T[0-9]{6}Z[.]tar[.]gz$')
    fail_msg: "Provide a Vault backup object under the approved GCS prefix."

- name: Check previous restore files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/vault/data.pre-restore
    - /etc/vault.d/unseal.key.pre-restore
  register: previous_restore

- name: Require clean restore state
  ansible.builtin.assert:
    that:
      - previous_restore.results | selectattr('stat.exists') | list | length == 0
    fail_msg: "Previous restore files exist. Restore blocked."

- name: Prepare Vault backup
  block:
    - name: Create temporary local directory
      ansible.builtin.tempfile:
        state: directory
        prefix: vault-gcp-restore-
      delegate_to: localhost
      become: false
      register: vault_temp

    - name: Download encrypted Vault backup
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - cp
          - "{{ gcp_backup_object }}"
          - "{{ vault_temp.path }}/encrypted.tar.gz"
          - --impersonate-service-account=ansible-backup@proxmox-iac-k3s-lab.iam.gserviceaccount.com
      delegate_to: localhost
      become: false

    - name: Decrypt backup
      ansible.builtin.command:
        argv:
          - ansible-vault
          - decrypt
          - --vault-password-file
          - "{{ lookup('env', 'HOME') }}/.k3s-backup-password"
          - --output
          - "{{ vault_temp.path }}/vault-backup.tar.gz"
          - "{{ vault_temp.path }}/encrypted.tar.gz"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Verify backup archive
      ansible.builtin.command:
        argv:
          - tar
          - -tzf
          - "{{ vault_temp.path }}/vault-backup.tar.gz"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Upload backup
      ansible.builtin.copy:
        src: "{{ vault_temp.path }}/vault-backup.tar.gz"
        dest: /root/vault-restore.tar.gz
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Restore Vault
      block:
        - name: Mark service restoration required
          ansible.builtin.set_fact:
            gcp_vault_services_touched: true

        - name: Stop Vault
          ansible.builtin.systemd_service:
            name: vault
            state: stopped

        - name: Preserve existing unseal key
          ansible.builtin.copy:
            src: /etc/vault.d/unseal.key
            dest: /etc/vault.d/unseal.key.pre-restore
            remote_src: true
            mode: "0600"
          no_log: true

        - name: Preserve existing data
          ansible.builtin.command:
            argv:
              - mv
              - /opt/vault/data
              - /opt/vault/data.pre-restore

        - name: Extract backup
          ansible.builtin.unarchive:
            src: /root/vault-restore.tar.gz
            dest: /
            remote_src: true
          no_log: true

        - name: Secure unseal key
          ansible.builtin.file:
            path: /etc/vault.d/unseal.key
            owner: root
            group: root
            mode: "0600"

        - name: Start Vault
          ansible.builtin.systemd_service:
            name: vault
            state: started

        - name: Unseal Vault
          ansible.builtin.systemd_service:
            name: vault-unseal
            state: restarted

        - name: Verify Vault status
          ansible.builtin.command:
            argv:
              - vault
              - status
              - -address=http://127.0.0.1:8200
          register: vault_status
          retries: 5
          delay: 3
          until: vault_status.rc == 0
          changed_when: false

      rescue:
        - name: Stop Vault for rollback
          ansible.builtin.systemd_service:
            name: vault
            state: stopped

        - name: Check preserved data
          ansible.builtin.stat:
            path: /opt/vault/data.pre-restore
          register: original_data

        - name: Restore original data
          when: original_data.stat.exists
          block:
            - name: Remove failed data
              ansible.builtin.file:
                path: /opt/vault/data
                state: absent

            - name: Move original data back
              ansible.builtin.command:
                argv:
                  - mv
                  - /opt/vault/data.pre-restore
                  - /opt/vault/data

        - name: Check preserved unseal key
          ansible.builtin.stat:
            path: /etc/vault.d/unseal.key.pre-restore
          register: original_key

        - name: Restore original unseal key
          ansible.builtin.copy:
            src: /etc/vault.d/unseal.key.pre-restore
            dest: /etc/vault.d/unseal.key
            remote_src: true
            mode: "0600"
          when: original_key.stat.exists
          no_log: true

        - name: Start original Vault
          ansible.builtin.systemd_service:
            name: vault
            state: started

        - name: Unseal original Vault
          ansible.builtin.systemd_service:
            name: vault-unseal
            state: restarted

        - name: Verify original Vault status
          ansible.builtin.command:
            argv:
              - vault
              - status
              - -address=http://127.0.0.1:8200
          changed_when: false

        - name: Report failed restore
          ansible.builtin.fail:
            msg: "Vault restore failed. Rollback attempted."

  always:
    - name: Start Vault after restore attempt
      ansible.builtin.systemd_service:
        name: vault
        state: started
      when: gcp_vault_services_touched | default(false) | bool

    - name: Unseal Vault after restore attempt
      ansible.builtin.systemd_service:
        name: vault-unseal
        state: restarted
      when: gcp_vault_services_touched | default(false) | bool

    - name: Remove remote temporary archive
      ansible.builtin.file:
        path: /root/vault-restore.tar.gz
        state: absent

    - name: Remove local temporary directory
      ansible.builtin.file:
        path: "{{ vault_temp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: vault_temp.path is defined
