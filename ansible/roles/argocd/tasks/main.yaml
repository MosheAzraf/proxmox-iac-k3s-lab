---
- name: Add Argo CD Helm repository
  kubernetes.core.helm_repository:
    name: "{{ argocd_repo_name }}"
    repo_url: "{{ argocd_repo_url }}"

- name: Check existing Argo CD Helm release
  kubernetes.core.helm_info:
    name: "{{ argocd_release_name }}"
    release_namespace: "{{ argocd_namespace }}"
  register: argocd_release

- name: Install Argo CD for initial bootstrap
  kubernetes.core.helm:
    name: "{{ argocd_release_name }}"
    chart_ref: "{{ argocd_chart }}"
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    wait: true
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config"
  when: argocd_release.status is not defined
