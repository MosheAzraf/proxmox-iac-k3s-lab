
---
- name: Backup local-path storage
  when: not ansible_check_mode
  block:
    - name: Schedule emergency recovery
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=k3s-backup-recovery
          - --on-active=30min
          - /usr/bin/systemctl
          - start
          - k3s-agent

    - name: Stop k3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: stopped

    - name: Stop remaining k3s containers
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-killall.sh

    - name: Archive storage
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - /root/pvc-backup.tar.gz
          - -C
          - /var/lib/rancher/k3s
          - storage

    - name: Download backup
      ansible.builtin.fetch:
        src: /root/pvc-backup.tar.gz
        dest: "{{ lookup('env', 'HOME') }}/k3s-backups/{{ inventory_hostname }}-pvc.tar.gz"
        flat: true

  always:
    - name: Reconnect to worker
      ansible.builtin.wait_for_connection:
        timeout: 120
        delay: 5

    - name: Start k3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started

    - name: Cancel emergency recovery
      ansible.builtin.systemd_service:
        name: k3s-backup-recovery.timer
        state: stopped

    - name: Remove temporary archive
      ansible.builtin.file:
        path: /root/pvc-backup.tar.gz
        state: absent
